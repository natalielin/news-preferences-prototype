      --ink: #eeeeee;

  .step-toggle {

  .step-toggle::before {
    content: "";

    height: 0;

  .h {

  }
  .dot { width: 8px; height: 8px; border-radius: 1px; flex: none; }
  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.3;
    color: var(--ml-ink);
    background: var(--ml-soft);
    border-radius: var(--radius);
    padding: 2px 6px;

  }
  .tag.ok { color: var(--ok); background: var(--ok-soft); }

  .topic-field {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    position: relative;

  }
  .topic-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .topic-field input[type="text"]:focus { border: 0; box-shadow: none; }
  .topic-drop {
    position: absolute;
    z-index: 6;
    left: 0;
    right: 0;
    top: calc(100% + 4px);
    background: var(--surface);

  .topic-row {

    align-items: center;

  .topic-chips { display: flex; flex-wrap: wrap; gap: 4px; }

  .check {

    align-items: center;
    gap: 6px;
    margin-top: 8px;
    cursor: pointer;

  .stage-link { margin-top: 6px; }
  .card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 10px 12px;

  }
  .card-h { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; }
  .subject { margin-top: 6px; }
  .push-title { margin-top: 6px; font-weight: 600; }
  .push-body { color: var(--muted); }
  .field { margin-top: 8px; }
  .field span {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input[type="text"], textarea {
    width: 100%;
    border: 1px solid var(--line-strong);

  .band {

  .modal {

    inset: 0;

    align-items: center;
    justify-content: center;
    padding: 16px;

  .dialog {
    width: 440px;
    max-width: 100%;

    background: var(--surface);

    padding: 14px;

  }
  @media (max-width: 640px) {
    .tiles, .tiles.cols-3 { grid-template-columns: 1fr; }
  }
</style>

  { id: "registered", label: "Registered", ids: ["standard", "trial", "freeMonth"] },
  { id: "subscribers", label: "Subscribers", ids: ["allAccess", "family", "singleBrand"] },
  { id: "former", label: "Former subscribers", ids: ["former"] },

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtMult(n) {
  return n >= 1 ? n.toFixed(1) : n.toFixed(2);
}

function fmtCount(n) {
  if (!isFinite(n) || n <= 0) return "0";
  if (n >= 100000) return Math.round(n / 1000).toLocaleString("en-US") + "k";
  if (n >= 1000) {
    const k = Math.round(n / 100) / 10;
    return (Number.isInteger(k) ? String(k) : k.toFixed(1)) + "k";
  }
  return Math.round(n).toLocaleString("en-US");
}

function fmtRange(n) {
  return fmtCount(n * 0.85) + "–" + fmtCount(n * 1.15);
}

function fmtRate(p) {
  if (p >= 10) return p.toFixed(1) + "%";
  if (p >= 1) return p.toFixed(2) + "%";
  const text = p.toFixed(3);
  if (Number(text) >= 0.1 && p < 0.1) return p.toFixed(4) + "%";
  return text + "%";
}

function fmtLimit(n) {
  if (n >= 10) return n.toFixed(0) + "%";
  if (n >= 1) return n.toFixed(1).replace(/\.0$/, "") + "%";
  if (Math.abs(n - 0.1) < 1e-9) return "0.10%";
  return n.toFixed(1) + "%";
}

function fmtLift(pct) {
  const n = Math.round(pct);
  if (n > 0) return "+" + n + "%";
  if (n < 0) return "−" + Math.abs(n) + "%";
  return "0%";
}

function suggestedReach() {
  if (state.goal.value === "breaking") return "full";
  if (state.goal.value === "grow") return "focused";
  return "balanced";

function suggestedTiming() {
  return state.goal.value === "breaking" ? "fixed" : "reader";
}

function selectedStageList() {
  return STAGES.filter((s) => state.audience.stages[s.id]);
}

function rawK() {
  return selectedStageList().reduce((sum, s) => sum + s.k, 0);
}

function currentTopic() {
  if (!state.topic.topicId) return null;
  for (const section of TAXONOMY) {
    const topic = section.topics.find((item) => item.id === state.topic.topicId);
    if (topic) return { section, topic };
  }
  return null;
}

function orderedSubIds() {
  const cur = currentTopic();
  if (!cur) return [];
  return cur.topic.subs.map((sub) => sub.id).filter((id) => state.topic.subIds.includes(id));
}

function subShare() {
  const cur = currentTopic();
  const ids = orderedSubIds();
  if (!cur || !ids.length) return 1;
  const shares = ids.map((id) => cur.topic.subs.find((sub) => sub.id === id).share);
  return 1 - shares.reduce((product, share) => product * (1 - share), 1);
}

function locationShare() {
  if (!state.topic.location) return 1;
  const loc = LOCATIONS.find((item) => item.id === state.topic.location);
  return loc ? loc.share : 1;
}

function topicFactor() {
  const cur = currentTopic();
  if (!cur) return 1;
  return (cur.topic.k / 400) * subShare() * locationShare();
}

function interestedCount() {
  const cur = currentTopic();
  const k = cur ? cur.topic.k : 400;
  return k * 1000 * (cur ? subShare() : 1) * locationShare();
}

function isLeadTopic() {
  return state.topic.topicId === "animals" && state.topic.subIds.length === 0 && !state.topic.location;
}

function tokenLabel() {
  const cur = currentTopic();

  if (!ids.length) return cur.topic.label;
  const names = ids.map((id) => cur.topic.subs.find((sub) => sub.id === id).label);
  return cur.topic.label + " › " + names.join(", ");

function topicLeaf() {

function catalog() {

        k: topic.k,
        names: [topic.label.toLowerCase()]
      });
      topic.subs.forEach((sub) => {
        rows.push({
          sectionId: section.id,
          topicId: topic.id,
          subId: sub.id,
          path: [section.label, topic.label, sub.label],
          k: topic.k * sub.share,
          names: [sub.label.toLowerCase()].concat(sub.synonyms || [])
        });
      });
    });
  });
  return rows;
}

function findTopic(topicId) {

  return null;
}

function normPhrase(value) {
  return String(value).toLowerCase().replace(/&/g, " & ").replace(/[^a-z0-9&]+/g, " ").replace(/\s+/g, " ").trim();
}

function parseQuery(raw) {
  let text = " " + normPhrase(raw) + " ";
  let location = null;
  LOCATIONS.forEach((loc) => {
    const phrase = " " + loc.phrase + " ";
    if (text.includes(phrase)) {
      location = loc.id;
      text = text.replace(phrase, " ");
    }
  });
  let permission = null;
  ["opted in", "newsletter readers"].forEach((phrase) => {
    const wrapped = " " + phrase + " ";
    if (text.includes(wrapped)) {
      permission = "optin";
      text = text.replace(wrapped, " ");
    }
  });
  let stageIds = null;
  if (/\b(lapsed|former)\b/.test(text)) {
    stageIds = ["former"];
    text = text.replace(/\b(lapsed|former)\b/g, " ").replace(/\b(subscribers|paying)\b/g, " ");
  } else if (/\bnew readers\b/.test(text) || /\btrial\b/.test(text)) {
    stageIds = ["trial", "freeMonth"];
    text = text.replace(/\bnew readers\b/g, " ").replace(/\btrial\b/g, " ");
  } else if (/\b(subscribers|paying)\b/.test(text)) {
    stageIds = ["allAccess", "family", "singleBrand"];
    text = text.replace(/\b(subscribers|paying)\b/g, " ");
  }
  const beforeFiller = text;
  text = text.replace(/\binterested in\b/g, " ");
  ["fans", "fan", "readers", "reader", "who", "like", "likes", "the", "a", "an", "and", "of", "to"].forEach((word) => {
    text = text.replace(new RegExp("\\b" + word + "\\b", "g"), " ");
  });
  const fillerUsed = normPhrase(beforeFiller) !== normPhrase(text);
  text = text.replace(/\s+/g, " ").trim();
  const aliases = [];
  catalog().forEach((row) => {
    row.names.forEach((name) => aliases.push({ name: normPhrase(name), row }));
  });
  aliases.sort((a, b) => b.name.length - a.name.length);
  const matches = [];
  let guard = 0;
  while (text && guard < 8) {
    guard += 1;
    const hit = aliases.find((alias) => (" " + text + " ").includes(" " + alias.name + " "));
    if (!hit) break;
    if (!matches.some((row) => row.topicId === hit.row.topicId && row.subId === hit.row.subId)) matches.push(hit.row);
    text = (" " + text + " ").replace(" " + hit.name + " ", " ").replace(/\s+/g, " ").trim();
  }
  const unused = text ? text.split(" ").filter(Boolean) : [];
  const interpret = !!(location || permission || stageIds || unused.length || matches.length > 1 || fillerUsed);
  return { location, permission, stageIds, matches, unused, interpret };
}

function selectionFrom(parsed) {
  if (!parsed.matches.length) return null;
  const first = parsed.matches[0];
  const same = parsed.matches.filter((row) => row.topicId === first.topicId);
  const subIds = same.map((row) => row.subId).filter(Boolean);
  return { sectionId: first.sectionId, topicId: first.topicId, subIds };
}

function fmtAbout(n) {
  if (n >= 1000) {
    const rounded = Math.round(n / 1000);
    if (Math.abs(n / 1000 - rounded) > 0.05) return "about " + rounded + "k";
  }
  return fmtCount(n);
}

function interpretCount(sel, parsed) {
  const topic = findTopic(sel.topicId);
  const shares = sel.subIds.map((id) => topic.subs.find((sub) => sub.id === id).share);
  const share = shares.length ? 1 - shares.reduce((product, item) => product * (1 - item), 1) : 1;
  const loc = parsed.location ? LOCATIONS.find((item) => item.id === parsed.location).share : 1;
  return topic.k * 1000 * share * loc;
}

function buildTopicRows(query) {
  const parsed = parseQuery(query);
  if (!String(query).trim()) return [];
  const rows = [];
  if (parsed.interpret && parsed.matches.length) {
    const sel = selectionFrom(parsed);
    rows.push({ type: "interpret", parsed, sel });
  }
  const seen = new Set();
  parsed.matches.forEach((item) => {
    const key = item.topicId + ":" + item.subId;
    if (seen.has(key)) return;
    seen.add(key);
    rows.push({ type: "match", item });
  });
  if (parsed.matches.length === 1 && !parsed.matches[0].subId && !parsed.interpret) {
    const topic = findTopic(parsed.matches[0].topicId);
    topic.subs.forEach((sub) => {
      const item = catalog().find((row) => row.topicId === topic.id && row.subId === sub.id);
      if (item) rows.push({ type: "match", item });
    });
  }
  if (!rows.length) rows.push({ type: "none" });
  return rows.slice(0, 6);
}

function paintTopicDrop() {

    drop.className = "topic-drop";
    drop.setAttribute("role", "listbox");

  }

  drop.innerHTML = topicUi.rows.map((row, index) => {
    const active = index === topicUi.active ? " active" : "";
    if (row.type === "none") {
      return `<div class="topic-row${active}" role="option" data-action="topic-apply" data-index="${index}"><span>No matching topic · try a broader word</span><button type="button" class="link" data-action="browse-topics">Browse all topics</button></div>`;
    }
    if (row.type === "interpret") {
      const topic = findTopic(row.sel.topicId);
      const labels = row.sel.subIds.length
        ? row.sel.subIds.map((id) => topic.subs.find((sub) => sub.id === id).label)
        : [topic.label];
      if (row.parsed.location) labels.push(LOCATIONS.find((item) => item.id === row.parsed.location).label);

        else if (row.parsed.stageIds.includes("trial")) labels.push("Trial");
        else labels.push("Subscribers");

    }

  }).join("");
}

function channelSet() {
  let ids = [];
  if (state.message.mode === "single") ids = state.message.single ? [state.message.single] : [];
  else if (state.message.mode === "multiple") ids = state.message.multi;
  else ids = state.message.allowed;
  return CH_ORDER.filter((id) => ids.includes(id));
}

function coverage(ids) {
  return 1 - ids.reduce((p, id) => p * (1 - CH[id].reach), 1);
}

function multiStats(base, ids) {
  const p0 = ids.reduce((p, id) => p * (1 - CH[id].reach), 1);
  const p1 = ids.reduce((sum, id) => {
    const others = ids.filter((x) => x !== id).reduce((p, x) => p * (1 - CH[x].reach), 1);
    return sum + CH[id].reach * others;
  }, 0);
  return {
    unique: base * (1 - p0),
    messages: ids.reduce((sum, id) => sum + base * CH[id].reach, 0),
    dupPeople: base * Math.max(0, 1 - p0 - p1)
  };
}

function compute() {
  const raw = rawK();
  const pool = state.audience.lookalike ? raw * 1.1 : raw;
  const perm = PERM[state.audience.permission];
  const reach = state.audience.reach ? REACH[state.audience.reach] : null;
  const tf = topicFactor();
  const base = reach && raw ? pool * 1000 * reach.share * perm.mult * tf : 0;
  const ids = channelSet();
  const vol = {};
  let unique = 0;
  let messages = 0;
  let dupPeople = 0;
  let reached = 0;
  if (base && ids.length) {
    if (state.message.mode === "dynamic") {
      const weights = state.message.preference === "declared" ? W_DECL : W_PRED;
      const sumW = ids.reduce((sum, id) => sum + weights[id], 0);
      reached = base * coverage(ids);
      ids.forEach((id) => { vol[id] = reached * (weights[id] / sumW); });
      unique = reached;
      messages = reached;
    } else if (state.message.mode === "multiple") {
      const stats = multiStats(base, ids);
      unique = stats.unique;
      messages = stats.messages;
      dupPeople = stats.dupPeople;
      ids.forEach((id) => { vol[id] = base * CH[id].reach; });
    } else {
      ids.forEach((id) => { vol[id] = base * CH[id].reach; });
      unique = vol[ids[0]] || 0;
      messages = unique;
    }
  }
  const sel = selectedStageList();
  const stageRisk = raw ? sel.reduce((sum, s) => sum + s.k * s.risk, 0) / raw : 0;
  let factor = 0;
  if (reach && raw) {
    factor = reach.risk * (stageRisk / 0.97) * perm.risk;
    if (state.emphasis.value === "urgent") factor *= 1.15;
    if (state.message.mode === "multiple" && unique > 0) {
      factor *= Math.max(1, (messages / unique) * 0.85);
    }
  }
  const emailFactor = state.message.mode === "dynamic" && ids.includes("email") && ids.length > 1
    ? factor * 0.8
    : factor;
  const rows = [];
  if (ids.includes("email")) {
    EMAIL_BASE.forEach((p) => {
      rows.push({ key: p.key, name: "Email · " + p.key, rate: p.base * emailFactor, high: 0.08, limit: 0.10 });
    });
  }
  if (ids.includes("push")) rows.push({ key: "Push", name: "Push", rate: 0.3 * factor, high: 0.5, limit: 0.8 });
  if (ids.includes("sms")) rows.push({ key: "SMS", name: "SMS", rate: 0.9 * factor, high: 1, limit: 1.5 });
  if (ids.includes("inapp")) rows.push({ key: "In-app", name: "In-app", rate: 4 * factor, high: 8, limit: 12 });
  rows.forEach((row) => {
    row.band = row.rate >= row.limit ? "over" : row.rate >= row.high ? "high" : "safe";
  });
  let reads = 0;
  Object.keys(vol).forEach((id) => { reads += vol[id] * CH[id].read; });
  const startRate = { inform: 0.004, breaking: 0.003, deepen: 0.008, grow: 0.015 }[state.goal.value] || 0.004;
  const starts = reads * startRate;
  const unsubs = (vol.email || 0) * 0.0018 * emailFactor + (vol.sms || 0) * ((0.9 * factor) / 100);
  const disables = (vol.push || 0) * ((0.3 * factor) / 100);
  const emailOnlyReads = base * CH.email.reach * CH.email.read;
  const lift = emailOnlyReads ? (reads / emailOnlyReads - 1) * 100 : 0;
  const reachCounts = {};
  Object.keys(REACH).forEach((id) => {
    reachCounts[id] = raw ? pool * 1000 * REACH[id].share * perm.mult * tf : 0;
  });
  const singleCounts = {};
  CH_ORDER.forEach((id) => { singleCounts[id] = base * CH[id].reach; });
  return {
    raw, pool, base, ids, vol, unique, messages, dupPeople, reached, factor, emailFactor,
    rows, reads, starts, unsubs, disables, lift, reachCounts, singleCounts,
    lookalikeAdd: raw * 0.1 * 1000 * tf
  };
}

function goalValid() { return !!state.goal.value; }
function audienceValid() { return rawK() > 0 && !!state.audience.reach; }
function emphasisValid() { return !!state.emphasis.value; }
function messageValid() {
  const ids = channelSet();
  if (!ids.length) return false;
  if (ids.includes("email") && !(state.message.preview && state.message.lead)) return false;
  if (ids.includes("push") && !state.message.usingDraft) return false;
  if (ids.includes("sms") && !state.message.sms.trim()) return false;
  return true;
}
function timingValid() {
  if (!state.timing.mode) return false;
  if (state.timing.mode === "fixed" && !state.timing.fixedWhen) return false;
  return true;
}
function valid(step) {
  if (step === "goal") return goalValid();
  if (step === "audience") return audienceValid();
  if (step === "emphasis") return emphasisValid();
  if (step === "message") return messageValid();
  if (step === "timing") return timingValid();
  return false;
}

function openSteps() {
  return ["goal", "audience", "emphasis", "message", "timing"].filter((step) => !state[step].saved).map((step) => STEP_LABEL[step]);
}
function allSaved() { return openSteps().length === 0; }

function mark(step) {
  if (step === "review") return allSaved() ? "done" : "";
  if (state[step].saved) return "done";
  if (step === "audience" && !state.suggestionsApplied && !state.topic.userChanged) return "sugg";
  if ((step === "message" || step === "timing") && !state[step].touched) return "sugg";
  return "";
}

function status(m) {
  if (m.raw === 0 || !state.audience.reach) return { kind: "empty", text: "No audience selected" };
  if (!m.ids.length) return { kind: "empty", text: "No channel selected" };
  const over = m.rows.filter((row) => row.band === "over");
  const high = m.rows.filter((row) => row.band === "high");
  if (over.length) return { kind: "over", text: "Over limit · " + over.map((row) => row.key).join(", ") };
  if (high.length) return { kind: "high", text: "Risk high · " + high.map((row) => row.key).join(", ") };
  return { kind: "safe", text: "Safe · all channels" };
}

function summary(step, m) {
  if (step === "goal") return state.goal.value ? GOAL[state.goal.value].label : "Not set";
  if (step === "audience") {
    if (!state.audience.reach || m.raw === 0) return "No audience";
    return fmtCount(m.base) + " · " + REACH[state.audience.reach].label;
  }
  if (step === "emphasis") return state.emphasis.value ? EMPH[state.emphasis.value].label : "Not set";
  if (step === "message") return m.ids.length ? MODE[state.message.mode].label : "No channel";
  if (step === "timing") return state.timing.mode ? TIME[state.timing.mode].label : "Not set";
  return status(m).text;
}

function touch(step) {
  state[step].touched = true;
  state[step].saved = false;
  state.sent = null;
}

function toggleList(list, id) {
  const index = list.indexOf(id);
  if (index >= 0) list.splice(index, 1);
  else list.push(id);
}

function applySuggestions() {
  const reach = suggestedReach();
  const timing = suggestedTiming();
  if (state.audience.permission !== "optin" || state.audience.reach !== reach || !state.audience.lookalike) {
    state.audience.saved = false;
  }
  state.audience.permission = "optin";
  state.audience.reach = reach;
  state.audience.lookalike = true;
  state.audience.touched = true;
  if (!state.topic.userChanged) {
    state.topic.sectionId = "science";
    state.topic.topicId = "animals";
    state.topic.subIds = [];
    state.topic.location = null;
    state.topic.unused = [];
    state.topic.fromSearch = { location: false, lifecycle: false, permission: false };
    state.topic.browseSection = "science";
    state.topic.browseTopic = "animals";
  }

  if (state.message.mode !== "dynamic") state.message.saved = false;
  state.message.mode = "dynamic";
  state.message.touched = true;

  if (state.timing.mode !== timing) state.timing.saved = false;
  state.timing.mode = timing;
  if (timing === "fixed") state.timing.fixedWhen = state.timing.fixedWhen || "tomorrow";
  state.timing.touched = true;
  state.suggestionsApplied = true;
  state.sent = null;
}

function bandLabel(band) {
  if (band === "over") return "Over limit";
  if (band === "high") return "High";
  return "Safe";
}

function tiles(inner, cols) {
  return `<div class="tiles${cols === 3 ? " cols-3" : ""}">${inner}</div>`;
}

function optButton(action, id, on, title, detail, extra) {
  return `<button type="button" class="opt${on ? " on" : ""}" data-action="${action}" data-id="${id}" aria-pressed="${on}">
    <span><span class="opt-title">${title}</span>${detail ? `<span class="opt-detail">${detail}</span>` : ""}</span>
    ${extra ? `<span class="opt-meta">${extra}</span>` : ""}
  </button>`;
}

function tag(text, kind) {
  const cls = kind === true || kind === "ok" ? " ok" : kind === "from" ? " from" : "";
  return `<span class="tag${cls}">${text}</span>`;
}

function channelChip(action, id, on, extra) {
  const ch = CH[id];
  const partial = on === "partial";
  const selected = on === true;
  return `<button type="button" class="chip${selected ? " on" : ""}${partial ? " partial" : ""}" data-action="${action}" data-id="${id}" aria-pressed="${selected}">
    <i class="dot" style="background:${ch.color}"></i>${ch.label} ${Math.round(ch.reach * 100)}%${extra ? " " + extra : ""}
  </button>`;
}

function viewGoal() {
  return tiles(Object.keys(GOAL).map((id) => {
    const item = GOAL[id];
    return optButton("goal", id, state.goal.value === id, item.label, item.detail);
  }).join(""));
}

function viewTopicSearch(m) {
  const label = tokenLabel();
  const suggested = isLeadTopic() ? tag("Suggested · lead story") : "";
  const token = label
    ? `<button type="button" class="chip on" data-action="topic-clear">${esc(label)} ×</button>${suggested}`
    : "";
  const placeholder = label ? "" : "Search topics or describe readers, e.g. wildlife fans in Colorado";
  const cur = currentTopic();
  const narrow = cur ? cur.topic.subs.map((sub) => {
    const on = state.topic.subIds.includes(sub.id);
    return `<button type="button" class="chip${on ? " on" : ""}" data-action="narrow" data-id="${sub.id}" aria-pressed="${on}">${esc(sub.label)} ${fmtCount(cur.topic.k * sub.share * 1000)}</button>`;
  }).join("") : "";
  let location = "";
  if (state.topic.location) {
    const loc = LOCATIONS.find((item) => item.id === state.topic.location);
    const parentK = cur ? cur.topic.k : 400;
    const count = fmtCount(parentK * subShare() * loc.share * 1000);
    location = `<button type="button" class="chip on" data-action="location-clear">${esc(loc.label)} ${count} ×</button>${state.topic.fromSearch.location ? tag("From search", "from") : ""}`;
  }
  const browse = state.topic.browse ? viewBrowse() : "";
  const summary = `${esc(label || "All readers")} · ${fmtCount(interestedCount())} interested · ${fmtCount(m.base)} newsletter opt-ins · 3.4% click rate · updated 3h ago`;
  const lead = state.topic.topicId !== "animals" ? `<div class="note warn">Lead story is tagged Animals</div>` : "";
  const unused = state.topic.unused.length
    ? `<div class="note warn">Not used: ${state.topic.unused.map((word) => `'${esc(word)}'`).join(", ")}</div>`
    : "";
  return `
    <label class="h" for="topic-search">Topic</label>
    <div class="topic-field" id="topic-field">
      ${token}
      <input id="topic-search" type="text" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="topic-drop" aria-label="Topic">
    </div>
    <div class="refine">
      <span class="refine-label">Narrow:</span>
      ${narrow}
      ${location}
      <button type="button" class="link" data-action="browse-topics">Browse all topics</button>
    </div>
    ${browse}
    <div class="note">${summary}</div>
    <div class="note">Source: Segment topic scores · as of 3h ago · daily refresh</div>
    <div class="note">Fallback: newsletter opt-in if a score is missing or older than 36h · Excluded: suppressed, messaged in 24h</div>
    ${lead}
    ${unused}
  `;
}

function viewBrowse() {
  const section = TAXONOMY.find((item) => item.id === state.topic.browseSection) || TAXONOMY[0];
  const topic = section.topics.find((item) => item.id === state.topic.browseTopic) || section.topics[0];
  const sectionBtns = TAXONOMY.map((item) => {
    const on = item.id === section.id;
    return `<button type="button" class="chip${on ? " on" : ""}" data-action="browse-section" data-id="${item.id}" aria-pressed="${on}">${esc(item.label)}</button>`;
  }).join("");
  const topicBtns = section.topics.map((item) => {
    const on = item.id === topic.id;
    return `<button type="button" class="chip${on ? " on" : ""}" data-action="browse-topic" data-id="${item.id}" aria-pressed="${on}">${esc(item.label)} ${fmtCount(item.k * 1000)}</button>`;
  }).join("");
  const subBtns = topic.subs.length
    ? topic.subs.map((sub) => {
      const on = state.topic.topicId === topic.id && state.topic.subIds.length === 1 && state.topic.subIds[0] === sub.id;
      return `<button type="button" class="chip${on ? " on" : ""}" data-action="browse-sub" data-id="${sub.id}" aria-pressed="${on}">${esc(sub.label)} ${fmtCount(topic.k * sub.share * 1000)}</button>`;
    }).join("")
    : `<div class="note">No subtopics</div>`;
  return `<div class="browse">
    <div class="col"><div class="refine-label">Section</div>${sectionBtns}</div>
    <div class="col"><div class="refine-label">Topic</div>${topicBtns}</div>
    <div class="col"><div class="refine-label">Subtopic</div>${subBtns}</div>
  </div>`;
}

function viewAudience(m) {
  const leaf = topicLeaf();
  const perm = Object.keys(PERM).map((id) => {
    const item = PERM[id];
    const detail = id === "optin" ? `Subscribed to ${currentTopic() ? leaf : "any topic"}` : item.detail;
    const suggested = id === "optin" ? tag("Suggested") : "";
    return optButton("permission", id, state.audience.permission === id, item.label, `${detail} · ×${fmtMult(item.mult)}`, suggested);
  }).join("");
  const scale = topicFactor();

  let chips = "";
  if (state.audience.stagesOpen) {
    chips = STAGES.map((s) => {
      const on = !!state.audience.stages[s.id];
      return `<button type="button" class="chip${on ? " on" : ""}" data-action="stage" data-id="${s.id}" aria-pressed="${on}">${s.label} ${fmtCount(s.k * scale * 1000)}</button>`;
    }).join("");
  } else {
    chips = GROUPS.map((g) => {
      const stages = STAGES.filter((s) => g.ids.includes(s.id));
      const onCount = stages.filter((s) => state.audience.stages[s.id]).length;
      const k = stages.reduce((sum, s) => sum + s.k, 0);
      const cls = onCount === stages.length ? " on" : onCount > 0 ? " partial" : "";
      const pressed = onCount === stages.length ? "true" : onCount > 0 ? "mixed" : "false";
      return `<button type="button" class="chip${cls}" data-action="group" data-id="${g.id}" aria-pressed="${pressed}">${g.label} ${fmtCount(k * scale * 1000)}</button>`;
    }).join("");
  }

  const reach = Object.keys(REACH).map((id) => {
    const item = REACH[id];
    const suggested = id === suggestedReach() ? tag("Suggested") : "";
    const count = `<span class="count">${fmtCount(m.reachCounts[id])}</span>`;
    return optButton("reach", id, state.audience.reach === id, `${item.label} ×${fmtMult(item.share)}`, "", suggested + count);
  }).join("");

  const notes = [];
  if (state.audience.stages.dormant) notes.push(`<div class="note warn">Dormant churned: 2.5x complaint risk · sent last in waves</div>`);
  if (state.audience.stages.anonymous) notes.push(`<div class="note">Anonymous readers reachable by push and in-app only</div>`);

  return `
    ${viewTopicSearch(m)}
    <div class="h">Permission ${state.topic.fromSearch.permission ? tag("From search", "from") : ""}</div>
    ${tiles(perm, 3)}
    <div class="h">Lifecycle ${state.topic.fromSearch.lifecycle ? tag("From search", "from") : ""}</div>
    <div class="chips">${chips}</div>
    <div class="stage-link"><button type="button" class="link" data-action="stages">${state.audience.stagesOpen ? "Fewer" : "All 10 stages"}</button></div>
    ${notes.join("")}
    <div class="h">Reach</div>
    ${tiles(reach)}
    <label class="check">
      <input type="checkbox" data-action="lookalike" ${state.audience.lookalike ? "checked" : ""}>
      <span>+${fmtCount(m.lookalikeAdd)} readers similar to ${esc(currentTopic() ? topicLeaf() + " fans" : "all readers")} · within their permissions</span>
      ${tag("Suggested")}
    </label>
    <div class="note">Next 20k: mostly Soft-lapse · 1.1% click rate · 3x complaint risk</div>
  `;
}

function viewEmphasis() {
  const options = Object.keys(EMPH).map((id) => {
    const item = EMPH[id];
    return optButton("emphasis", id, state.emphasis.value === id, item.label, item.detail);
  }).join("");
  return tiles(options, 3) + `<div class="note">Urgent sends this week: 1 of 2</div>`;
}

function contentCards(m) {
  const ids = m.ids;
  const cards = [];
  if (ids.includes("email")) {
    cards.push(`<div class="card">
      <div class="card-h"><i class="dot" style="background:${CH.email.color}"></i><strong>Email</strong></div>
      <div class="subject">Otters, owls and one very patient tortoise</div>
      <label class="check"><input type="checkbox" data-action="preview-text" ${state.message.preview ? "checked" : ""}> Preview text</label>
      <label class="check"><input type="checkbox" data-action="lead" ${state.message.lead ? "checked" : ""}> Lead story under 24h old</label>
    </div>`);
  }
  if (ids.includes("push")) {
    const title = state.message.pushTitle;
    const over = title.length > 50;
    const body = state.message.pushEditing
      ? `<div class="field"><span>Title</span><input id="push-title" type="text" value="${esc(title)}" aria-label="Title" autocomplete="off"></div>
         <div class="field"><span>Body</span><input id="push-body" type="text" aria-label="Body" value="${esc(state.message.pushBody)}" autocomplete="off"></div>`
      : `<div class="push-title">${esc(title)}</div><div class="push-body">${esc(state.message.pushBody)}</div>`;
    cards.push(`<div class="card${state.message.usingDraft ? " using" : ""}">
      <div class="card-h">
        <i class="dot" style="background:${CH.push.color}"></i><strong>Push</strong>
        ${tag("Suggested from email")}
        <span class="grow"></span>
        <button type="button" class="btn" data-action="push-edit">${state.message.pushEditing ? "Done" : "Edit"}</button>
        <button type="button" class="btn${state.message.usingDraft ? " using" : ""}" data-action="push-draft">${state.message.usingDraft ? "Using draft" : "Use draft"}</button>
      </div>
      ${body}
      <div class="note count${over ? " over" : ""}" id="push-count">${title.length}/50</div>
    </div>`);
  }
  if (ids.includes("inapp")) {
    cards.push(`<div class="card">
      <div class="card-h"><i class="dot" style="background:${CH.inapp.color}"></i><strong>In-app</strong> ${tag("From email", true)}</div>
      <div class="note">Lead story card · uses the email headline and image</div>
    </div>`);
  }
  if (ids.includes("sms")) {
    const len = state.message.sms.length;
    cards.push(`<div class="card">
      <div class="card-h"><i class="dot" style="background:${CH.sms.color}"></i><strong>SMS</strong><span class="grow"></span><span class="count${len > 160 ? " over" : ""}" id="sms-count">${len}/160</span></div>
      <textarea id="sms-body" rows="3" aria-label="SMS" autocomplete="off">${esc(state.message.sms)}</textarea>
    </div>`);
  }
  return cards.join("");
}

function viewMessage(m) {
  const modes = Object.keys(MODE).map((id) => {
    const item = MODE[id];
    const suggested = id === "dynamic" ? tag("Suggested") : "";
    return optButton("mode", id, state.message.mode === id, item.label, item.detail, suggested);
  }).join("");

  let detail = "";
  if (state.message.mode === "single") {
    const chips = CH_ORDER.map((id) => channelChip("single", id, state.message.single === id, fmtCount(m.singleCounts[id]))).join("");
    detail = `<div class="chips" style="margin-top:8px">${chips}</div>`;
  } else if (state.message.mode === "multiple") {
    const chips = CH_ORDER.map((id) => channelChip("multi", id, state.message.multi.includes(id))).join("");
    const warn = m.dupPeople > 30000;
    detail = `<div class="chips" style="margin-top:8px">${chips}</div>
      <div class="note${warn ? " warn" : ""}">${fmtCount(m.unique)} readers · ${fmtCount(m.messages)} messages · ${fmtCount(m.dupPeople)} readers get more than one</div>`;
  } else {
    const pref = [
      optButton("pref", "declared", state.message.preference === "declared", "Declared only", "22% have one · rest get email"),
      optButton("pref", "predicted", state.message.preference === "predicted", "Declared, then predicted", "Model fills in the rest", tag("Suggested"))
    ].join("");
    const chips = CH_ORDER.map((id) => channelChip("allow", id, state.message.allowed.includes(id))).join("");
    const total = m.reached || 0;
    const bar = CH_ORDER.filter((id) => m.vol[id]).map((id) => {
      const width = total ? (m.vol[id] / total) * 100 : 0;
      return `<span style="width:${width}%;background:${CH[id].color}"></span>`;
    }).join("");
    const legend = CH_ORDER.filter((id) => m.vol[id]).map((id) => {
      return `<i><b class="dot" style="background:${CH[id].color}"></b>${CH[id].label} ${fmtCount(m.vol[id])}</i>`;
    }).join("");
    detail = `
      <div class="h">Preference</div>
      ${tiles(pref)}
      <div class="h">Allowed channels</div>
      <div class="chips">${chips}</div>
      <div class="bar">${bar}</div>
      <div class="legend">${legend}</div>
      <div class="note">${fmtCount(m.reached)} readers · one message each · est. reads ${fmtLift(m.lift)} vs email only · declared preference always wins</div>
    `;
  }
  const cards = contentCards(m);
  return tiles(modes, 3) + detail + (cards ? `<div class="tiles">${cards}</div>` : "");
}

function timingNote(m) {
  const quiet = m.ids.includes("push") || m.ids.includes("sms") ? " · quiet hours 9 PM–8 AM" : "";
    if (state.timing.mode === "fixed") {
    if (state.timing.fixedWhen === "now") return { text: "Sends within minutes" + quiet, warn: false };
    if (state.timing.fixedWhen === "tomorrow") {
      return { text: "Morning Briefing reaches 61% of this audience at 7:00 AM · 9:30 AM is open" + quiet, warn: true };
    }
    return quiet ? { text: "Quiet hours 9 PM–8 AM", warn: false } : null;
  }
  if (state.timing.mode === "geo") {
    return { text: "7:00 AM in each reader's time zone · 8% unknown, sent at 7:00 AM ET" + quiet, warn: false };
  }
  if (state.timing.mode === "reader") {
    return { text: "Each reader's usual reading time within 6 hours · 7:00 AM local when unknown" + quiet, warn: false };
  }
  return null;
}

function viewTiming(m) {
  const options = Object.keys(TIME).map((id) => {
    const item = TIME[id];
    const suggested = id === suggestedTiming() ? tag("Suggested") : "";
    return optButton("timing", id, state.timing.mode === id, item.label, item.detail, suggested);
  }).join("");
  let chips = "";
  if (state.timing.mode === "fixed") {
    chips = `<div class="chips" style="margin-top:8px">
      <button type="button" class="chip${state.timing.fixedWhen === "now" ? " on" : ""}" data-action="when" data-id="now">Now</button>
      <button type="button" class="chip${state.timing.fixedWhen === "tomorrow" ? " on" : ""}" data-action="when" data-id="tomorrow">7:00 AM ET tomorrow</button>
    </div>`;
  }
  const note = timingNote(m);
  return tiles(options, 3) + chips + (note ? `<div class="note${note.warn ? " warn" : ""}">${note.text}</div>` : "");
}

function preSend(m) {
  const bits = [];
  let warn = false;
  if (state.timing.mode === "fixed" && state.timing.fixedWhen === "tomorrow") {
    bits.push("Overlaps Morning Briefing");
    warn = true;
  } else bits.push("No overlap with other sends");
  if (state.emphasis.value === "urgent") {
    bits.push("skips frequency limits");
    warn = true;
  } else bits.push("within frequency");
  if (state.message.mode === "multiple" && m.dupPeople > 0) {
    bits.push(fmtCount(m.dupPeople) + " get more than one");
    if (m.dupPeople > 30000) warn = true;
  }
  bits.push("permissions verified");
  bits.push("no spam triggers in subject");
  return { text: bits.join(" · "), warn };
}

function viewReview(m) {
  const st = status(m);
  const rows = m.rows.map((row) => `<tr data-risk="${esc(row.key)}">
    <td>${row.name}</td>
    <td class="num">${fmtRate(row.rate)}</td>
    <td class="num">${fmtLimit(row.limit)}</td>
    <td class="num"><span class="band ${row.band}">${bandLabel(row.band)}</span></td>
  </tr>`).join("");
  const table = m.rows.length ? `<div class="h">Predicted risk by channel</div>
    <table>
      <thead><tr><th>Channel</th><th class="num">Predicted</th><th class="num">Limit</th><th class="num">Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : "";
  const check = preSend(m);
  const open = openSteps();
  const sendLabel = state.sent === "signoff"
    ? "Activation sign-off requested"
    : state.sent === "activate"
      ? "Activated"
      : st.kind === "over" ? "Request activation sign-off" : "Activate audience";
  const receipt = !state.sent ? "" : state.sent === "signoff"
    ? `<div class="note" id="sent-note">Activation sign-off requested · ${esc(pageTitle())} · ${fmtCount(m.base)} eligible</div>`
    : `<div class="note" id="sent-note">Activated · ${esc(pageTitle())} · A-1842 · ${fmtCount(m.base)} eligible · fallback opt-in rules · measure 7 days</div>`;
  return `
    ${table}
    <div class="h">Expected results · range</div>
    <div class="stats">
      <div class="stat"><b>${fmtRange(m.reads)}</b><span>Reads</span></div>
      <div class="stat"><b>${fmtRange(m.starts)}</b><span>Subscription starts</span></div>
      <div class="stat"><b>${fmtRange(m.unsubs)}</b><span>Unsubscribes</span></div>
      <div class="stat"><b>${fmtRange(m.disables)}</b><span>Disables</span></div>
    </div>
    <div class="h">Before activation</div>
    <div class="note${check.warn ? " warn" : ""}" id="presend">${check.text}</div>
    <div class="note warn" id="open-line" ${open.length ? "" : "hidden"}>Open: ${open.join(", ")}</div>
    ${receipt}
    <div class="actions">
      <button type="button" class="btn" data-action="preview">Preview</button>
      <button type="button" class="btn primary" id="send-btn" data-action="send" ${state.sent || !allSaved() ? "disabled" : ""}>${sendLabel}</button>
    </div>
  `;
}

function viewBody(step, m) {
  if (step === "goal") return viewGoal();
  if (step === "audience") return viewAudience(m);
  if (step === "emphasis") return viewEmphasis();
  if (step === "message") return viewMessage(m);
  if (step === "timing") return viewTiming(m);
  return viewReview(m);
}

function view() {
  const m = compute();
  const st = status(m);
  const allOpen = STEP_ORDER.every((step) => state.open[step]);
  const tabs = STEP_ORDER.map((step) => {
    const kind = mark(step);
    const glyph = kind === "done" ? "✓ " : kind === "sugg" ? "◦ " : "";
    return `<button type="button" data-action="goto" data-step="${step}"><span class="mark ${kind}" id="mark-${step}">${glyph}</span>${STEP_LABEL[step]}</button>`;
  }).join("");
  const steps = STEP_ORDER.map((step) => {
    const open = state.open[step];
    const save = step === "review" ? "" : `<button type="button" class="save${state[step].saved ? " saved" : ""}" id="save-${step}" data-action="save" data-step="${step}" ${valid(step) ? "" : "disabled"}>${state[step].saved ? "Saved" : "Save"}</button>`;
    return `<section class="step${open ? "" : " shut"}" id="step-${step}">
      <div class="step-h">
        <button type="button" class="step-toggle" data-action="toggle" data-step="${step}">
          <span class="step-name">${STEP_LABEL[step]}</span>
          ${open ? "" : `<span class="step-sum">${esc(summary(step, m))}</span>`}
        </button>
        ${save}
      </div>
      ${open ? `<div class="step-b">${viewBody(step, m)}</div>` : ""}
    </section>`;
  }).join("");
  const preview = state.preview ? viewPreview(m) : "";
  return `
    <header class="head">
      <div>
        <h1>${esc(pageTitle())}</h1>
        <div class="updated">Updated 3h ago</div>
      </div>
      <div class="tools">
        <div class="pill ${st.kind}" id="pill">${st.text}</div>
        <button type="button" class="btn primary${state.suggestionsApplied ? " applied" : ""}" id="use-suggestions" data-action="use-suggestions" ${state.suggestionsApplied ? "disabled" : ""}>${state.suggestionsApplied ? "Suggestions applied" : "Use suggestions"}</button>
        <button type="button" class="link" id="collapse-link" data-action="toggle-all">${allOpen ? "Collapse" : "Expand all"}</button>
      </div>
    </header>
    <nav class="progress">${tabs}</nav>
    <div class="steps" id="steps">${steps}</div>
    ${preview}
  `;
}

function viewPreview(m) {
  const blocks = [];
  if (m.ids.includes("email")) {
    blocks.push(`<div class="card"><div class="card-h"><i class="dot" style="background:${CH.email.color}"></i><strong>Email</strong></div><div class="subject">Otters, owls and one very patient tortoise</div></div>`);
  }
  if (m.ids.includes("push")) {
    blocks.push(`<div class="card"><div class="card-h"><i class="dot" style="background:${CH.push.color}"></i><strong>Push</strong></div><div class="push-title">${esc(state.message.pushTitle)}</div><div class="push-body">${esc(state.message.pushBody)}</div></div>`);
  }
  if (m.ids.includes("inapp")) {
    blocks.push(`<div class="card"><div class="card-h"><i class="dot" style="background:${CH.inapp.color}"></i><strong>In-app</strong></div><div class="note">Lead story card · Otters, owls and one very patient tortoise</div></div>`);
  }
  if (m.ids.includes("sms") && state.message.sms.trim()) {
    blocks.push(`<div class="card"><div class="card-h"><i class="dot" style="background:${CH.sms.color}"></i><strong>SMS</strong></div><div class="subject">${esc(state.message.sms)}</div></div>`);
  }
  return `<div class="modal" id="modal">
    <div class="dialog" role="dialog" aria-label="Preview">
      <div class="card-h"><h2>Preview</h2><span class="grow"></span><button type="button" class="btn" data-action="close-preview">Close</button></div>
      ${blocks.join("") || `<div class="note">No channel selected</div>`}
    </div>
  </div>`;
}

function render() {
  const scroller = document.getElementById("scroller");
  const top = scroller.scrollTop;
  const title = pageTitle();
  document.title = title + " · Audiences · Message Hub · Scoop";
  const crumb = document.getElementById("crumb-current");
  if (crumb) crumb.textContent = title;
  document.getElementById("app").innerHTML = view();
  scroller.scrollTop = top;
}

function syncAfterTextInput() {
  state.message.touched = true;
  state.message.saved = false;
  state.sent = null;
  const btn = document.getElementById("save-message");
  if (btn) {
    btn.disabled = !messageValid();
    btn.textContent = "Save";
    btn.classList.remove("saved");
  }
  const markEl = document.getElementById("mark-message");
  if (markEl) {
    markEl.textContent = "";
    markEl.className = "mark";
  }
  const open = openSteps();
  const line = document.getElementById("open-line");
  if (line) {
    line.hidden = open.length === 0;
    line.textContent = open.length ? "Open: " + open.join(", ") : "";
  }
  const send = document.getElementById("send-btn");
  if (send) {
    const st = status(compute());
    send.textContent = st.kind === "over" ? "Request activation sign-off" : "Activate audience";
    send.disabled = !allSaved();
  }
  const sent = document.getElementById("sent-note");
  if (sent) sent.remove();
}

function onClick(e) {
  if (e.target.id === "modal") {
    state.preview = false;
    render();
    return;
  }
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  const step = t.dataset.step;

  if (action === "toggle-all") {
    const all = STEP_ORDER.every((key) => state.open[key]);
    STEP_ORDER.forEach((key) => { state.open[key] = !all; });
    render();
    return;
  }
  if (action === "toggle") {
    state.open[step] = !state.open[step];
    render();
    return;
  }
  if (action === "goto") {
    state.open[step] = true;
    render();
    const sc = document.getElementById("scroller");
    const el = document.getElementById("step-" + step);
    const strip = document.querySelector(".progress");
    if (sc && el) {
      const offset = (strip ? strip.offsetHeight : 0) + 12;
      const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
      sc.scrollTop = Math.max(0, top - offset);
    }
    return;
  }
  if (action === "save") {
    if (!valid(step)) return;
    state[step].saved = true;
    state[step].touched = true;
    render();
    return;
  }
  if (action === "use-suggestions") {
    if (state.suggestionsApplied) return;
    applySuggestions();
    render();
    return;
  }
  if (action === "goal") {
    state.goal.value = id;
    touch("goal");
    if (!state.audience.touched) state.audience.reach = suggestedReach();
    if (!state.timing.touched) {
      state.timing.mode = suggestedTiming();
      if (state.timing.mode === "fixed") state.timing.fixedWhen = "tomorrow";
    }
    render();
    return;
  }
  if (action === "permission") {
    state.audience.permission = id;
    state.topic.fromSearch.permission = false;
    touch("audience");
    render();
    return;
  }
  if (action === "group") {
    const group = GROUPS.find((item) => item.id === id);
    const allOn = group.ids.every((sid) => state.audience.stages[sid]);
    group.ids.forEach((sid) => { state.audience.stages[sid] = !allOn; });
    state.topic.fromSearch.lifecycle = false;
    touch("audience");
    render();
    return;
  }
  if (action === "stage") {
    state.audience.stages[id] = !state.audience.stages[id];
    state.topic.fromSearch.lifecycle = false;
    touch("audience");
    render();
    return;
  }
  if (action === "topic-clear") {
    state.topic.topicId = null;
    state.topic.subIds = [];
    state.topic.unused = [];
    markTopicEdited();
    render();
    return;
  }
  if (action === "narrow") {
    const index = state.topic.subIds.indexOf(id);
    if (index >= 0) state.topic.subIds.splice(index, 1);
    else state.topic.subIds.push(id);
    markTopicEdited();
    render();
    return;
  }
  if (action === "location-clear") {
    state.topic.location = null;
    state.topic.fromSearch.location = false;
    markTopicEdited();
    render();
    return;
  }
  if (action === "browse-topics") {
    state.topic.browse = !state.topic.browse;
    if (state.topic.browse && state.topic.topicId) {
      state.topic.browseSection = state.topic.sectionId;
      state.topic.browseTopic = state.topic.topicId;
    }
    topicUi.open = false;
    render();
    return;
  }
  if (action === "browse-section") {
    if (state.topic.browseSection !== id) {
      state.topic.browseSection = id;
      const section = TAXONOMY.find((item) => item.id === id);
      state.topic.browseTopic = section.topics[0].id;
    }
    render();
    return;
  }
  if (action === "browse-topic") {
    state.topic.browseTopic = id;
    state.topic.sectionId = state.topic.browseSection;
    state.topic.topicId = id;
    state.topic.subIds = [];
    state.topic.unused = [];
    markTopicEdited();
    render();
    return;
  }
  if (action === "browse-sub") {
    state.topic.sectionId = state.topic.browseSection;
    state.topic.topicId = state.topic.browseTopic;
    state.topic.subIds = [id];
    state.topic.unused = [];
    markTopicEdited();
    render();
    return;
  }
  if (action === "topic-apply") {
    applyTopicRow(topicUi.rows[Number(t.dataset.index)]);
    return;
  }
  if (action === "stages") {
    state.audience.stagesOpen = !state.audience.stagesOpen;
    render();
    return;
  }
  if (action === "reach") {
    state.audience.reach = id;
    touch("audience");
    render();
    return;
  }
  if (action === "emphasis") {
    state.emphasis.value = id;
    touch("emphasis");
    render();
    return;
  }
  if (action === "mode") {
    state.message.mode = id;
    touch("message");
    render();
    return;
  }
  if (action === "single") {
    state.message.single = id;
    touch("message");
    render();
    return;
  }
  if (action === "multi" || action === "allow") {
    toggleList(action === "multi" ? state.message.multi : state.message.allowed, id);
    touch("message");
    render();
    return;
  }
  if (action === "pref") {
    state.message.preference = id;
    touch("message");
    render();
    return;
  }
  if (action === "push-edit") {
    state.message.pushEditing = !state.message.pushEditing;
    touch("message");
    render();
    if (state.message.pushEditing) {
      const field = document.getElementById("push-title");
      if (field) field.focus();
    }
    return;
  }
  if (action === "push-draft") {
    state.message.usingDraft = !state.message.usingDraft;
    touch("message");
    render();
    return;
  }
  if (action === "timing") {
    state.timing.mode = id;
    touch("timing");
    render();
    return;
  }
  if (action === "when") {
    state.timing.fixedWhen = id;
    touch("timing");
    render();
    return;
  }
  if (action === "preview") {
    state.preview = true;
    render();
    return;
  }
  if (action === "close-preview") {
    state.preview = false;
    render();
    return;
  }
  if (action === "send") {
    if (state.sent || !allSaved()) return;
    state.sent = status(compute()).kind === "over" ? "signoff" : "activate";
    render();
  }
}

function onChange(e) {
  const action = e.target.dataset.action;
  if (action === "lookalike") {
    state.audience.lookalike = e.target.checked;
    touch("audience");
    render();
    return;
  }
  if (action === "preview-text") {
    state.message.preview = e.target.checked;
    touch("message");
    render();
    return;
  }
  if (action === "lead") {
    state.message.lead = e.target.checked;
    touch("message");
    render();
  }
}

function onInput(e) {
  if (e.target.id === "topic-search") {
    topicUi.query = e.target.value;
    topicUi.open = !!topicUi.query.trim();
    topicUi.active = 0;
    topicUi.rows = buildTopicRows(topicUi.query);
    paintTopicDrop();
    return;
  }
  if (e.target.id === "push-title") {
    state.message.pushTitle = e.target.value;
    const count = document.getElementById("push-count");
    if (count) {
      count.textContent = e.target.value.length + "/50";
      count.classList.toggle("over", e.target.value.length > 50);
    }
    syncAfterTextInput();
    return;
  }
  if (e.target.id === "push-body") {
    state.message.pushBody = e.target.value;
    syncAfterTextInput();
    return;
  }
  if (e.target.id === "sms-body") {
    state.message.sms = e.target.value;
    const count = document.getElementById("sms-count");
    if (count) {
      count.textContent = e.target.value.length + "/160";
      count.classList.toggle("over", e.target.value.length > 160);
    }
    syncAfterTextInput();
  }
}

const app = document.getElementById("app");
app.addEventListener("click", onClick);
app.addEventListener("change", onChange);
app.addEventListener("input", onInput);
app.addEventListener("mousedown", (e) => {
  if (e.target.closest("#topic-drop")) e.preventDefault();
});
document.querySelectorAll('a[href="#"]').forEach((a) => {
  a.addEventListener("click", (e) => e.preventDefault());
});
document.addEventListener("keydown", (e) => {
  if (e.target && e.target.id === "topic-search" && topicUi.open) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const delta = e.key === "ArrowDown" ? 1 : -1;
      const last = topicUi.rows.length - 1;
      topicUi.active = Math.max(0, Math.min(last, topicUi.active + delta));
      paintTopicDrop();
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      applyTopicRow(topicUi.rows[topicUi.active]);
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      topicUi.open = false;
      paintTopicDrop();
      return;
    }
  }
  if (e.key === "Escape" && state.preview) {
    state.preview = false;
    render();
  }
});
render();
</script>
</body>
</html>
